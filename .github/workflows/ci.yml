name: GosTek CI

on:
  pull_request:
  push:
    branches: [main, dev/improvements]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore MAUI workloads
        run: dotnet workload restore GosTek.csproj
      - name: Test Windows
        run: dotnet test GosTek.Tests/GosTek.Tests.csproj --nologo
      - name: Build Android
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet build GosTek.csproj -f net10.0-android --nologo
